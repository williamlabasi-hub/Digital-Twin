[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin"
version = "0.1.0"
description = "Digital Twin satellite modeling package"
requires-python = ">=3.9"
dependencies = [
	"pandas",
	"scikit-learn",
	"joblib",
	"numpy>=1.26,<2.5",
	"sgp4",
	"skyfield",
	"requests>=2.31,<3.0",
	"jsonschema>=4.18,<5.0",
	"PyYAML>=6.0,<7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
