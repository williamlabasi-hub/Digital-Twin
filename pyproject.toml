[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin"
version = "0.1.0"
description = "Digital Twin satellite modeling package"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "jsonschema>=4.21,<5.0",
    "numpy>=1.26,<2.5",
    "pandas",
    "PyYAML>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "sgp4>=2.23",
    "skyfield>=1.48",
]

[project.scripts]
collision-risk-assess = "collision_risk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coa = ["*.json"]
"collision_risk.schemas" = ["*.json"]
"object_identification.schemas" = ["*.json"]
"object_identification.config" = ["*.json"]
"common.telemetry_contracts" = ["*.json", "*.yaml"]
"health.schemas" = ["*.json"]
