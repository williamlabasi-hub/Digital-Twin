[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin"
version = "0.1.0"
description = "Digital Twin satellite modeling package"
requires-python = ">=3.9"
dependencies = [
    "joblib>=1.3",
    "jsonschema>=4.21",
    "numpy>=1.26",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "sgp4>=2.23",
    "skyfield>=1.48",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
