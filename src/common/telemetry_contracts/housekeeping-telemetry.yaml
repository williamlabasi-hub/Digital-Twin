schema_version: "0.1.0"
document_status: prototype
authority: preliminary_literature_review
approval_status: unvalidated
intended_use:
  - interface_design
  - synthetic_data_generation
  - software_validation
prohibited_use:
  - flight_safety_decisions
  - autonomous_safe_mode_entry
  - certified_operational_limits

record_requirements:
  timestamp_format: ISO-8601 UTC
  missing_value_representation: null
  required_metadata:
    - schema_version
    - satellite_id
    - timestamp
    - source
    - spacecraft_mode

operational_context:
  eclipse_state:
    allowed_values: [sunlight, eclipse, transition, unknown]
    default_when_missing: unknown
  solar_array_configuration:
    allowed_values: [deployed, stowed, degraded, unknown]
    default_when_missing: unknown
  battery_current_sign_convention:
    allowed_values: [positive_discharge, positive_charge, unknown]
    default_when_missing: unknown
  communications_pass_state:
    allowed_values: [active, inactive, acquiring, unknown]
    default_when_missing: unknown
  approval_status: unvalidated
  notes:
    - Low solar current is not a hardware fault when eclipse or a stowed array explains it.
    - Synthetic health data uses positive_discharge; flight sign convention requires approval.
    - Low downlink rate is evaluated as a fault only during an active pass.

spacecraft_modes:
  - nominal
  - payload_operations
  - communications
  - safe
  - recovery
  - emergency

parameters:
  battery_voltage_v:
    display_name: Battery Voltage
    subsystem: power
    description: Measured spacecraft battery or battery-bus voltage.
    data_type: number
    unit: V
    physical_range: {minimum: 0, maximum: 50}
    operational_limits: {status: TBD}
    expected_sample_period_seconds: 10
    stale_after_seconds: 30
    nullable: false
    measurement_kind: direct
    source: {authority: prototype_assumption, reference: null, approval_status: unvalidated}

  battery_current_a:
    display_name: Battery Current
    subsystem: power
    description: Signed battery current; sign convention must be defined by the spacecraft interface.
    data_type: number
    unit: A
    physical_range: {minimum: -20, maximum: 20}
    operational_limits: {status: TBD}
    expected_sample_period_seconds: 10
    stale_after_seconds: 30
    nullable: false
    measurement_kind: direct
    notes: [Define whether positive current means charging or discharging.]
    source: {authority: prototype_assumption, reference: null, approval_status: unvalidated}

  battery_state_of_charge_pct:
    display_name: Battery State of Charge
    subsystem: power
    description: Estimated usable battery charge as a percentage.
    data_type: number
    unit: percent
    physical_range: {minimum: 0, maximum: 100}
    operational_limits: {status: TBD}
    expected_sample_period_seconds: 30
    stale_after_seconds: 90
    nullable: true
    measurement_kind: estimated
    notes: [Record estimator quality or uncertainty when available.]
    source: {authority: engineering_definition, reference: null, approval_status: pending}

  solar_array_voltage_v:
